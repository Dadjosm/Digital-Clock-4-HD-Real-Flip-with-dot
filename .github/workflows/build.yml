name: Build Digital Clock (flip animation)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this repo (for the patch)
        uses: actions/checkout@v4

      - name: Install Qt 5.12.9 (MinGW 7.3 32-bit, same as the official 4.7.8 build)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.12.9'
          host: 'windows'
          target: 'desktop'
          arch: 'win32_mingw73'
          cache: false

      - name: Install the MinGW 7.3 32-bit compiler that matches Qt
        run: |
          python -m pip install aqtinstall==3.1.*
          python -m aqt install-tool windows desktop tools_mingw qt.tools.win32_mingw730 --outputdir "$GITHUB_WORKSPACE/Qt"
          echo "$GITHUB_WORKSPACE/Qt/Tools/mingw730_32/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          g++ --version
          qmake -v
          mingw32-make --version | head -n1

      - name: Get source (tag stable_4.7.8) and dependencies
        run: |
          git config --global core.autocrlf false
          mkdir work && cd work
          git clone --depth 1 --branch stable_4.7.8 https://github.com/Kolcha/DigitalClock4.git DigitalClock4
          mkdir 3rdparty
          git clone --depth 1 https://github.com/Skycoder42/QHotkey.git 3rdparty/QHotkey
          git clone --depth 1 https://github.com/itay-grudev/SingleApplication.git 3rdparty/SingleApplication
          # the countdown timer plugin looks for QHotkey inside the source tree
          git clone --depth 1 https://github.com/Skycoder42/QHotkey.git DigitalClock4/3rdparty/QHotkey

      - name: Apply flip animation patch
        run: |
          cd work/DigitalClock4
          git apply --ignore-whitespace "$GITHUB_WORKSPACE/flip-animation.patch"
          git status --short

      - name: Skip plugins (only the exe is needed)
        run: |
          cd work/DigitalClock4
          sed -i '/^    plugins$/d; /^plugins.depends/d' DigitalClock.pro

      - name: Build
        run: |
          cd work/DigitalClock4
          lupdate -no-obsolete DigitalClock.pro
          qmake -config release -r
          mingw32-make -j4

      - name: Build countdown timer plugin
        run: |
          cd work/DigitalClock4/plugins/countdown_timer
          lupdate -no-obsolete countdown_timer.pro
          qmake -config release countdown_timer.pro
          mingw32-make -j4

      - name: Collect result
        run: |
          mkdir -p out/plugins
          EXE=$(find work/DigitalClock4 -name digital_clock.exe | head -n1)
          DLL=$(find work/DigitalClock4/plugins/countdown_timer -name countdown_timer.dll | head -n1)
          echo "Built: $EXE and $DLL"
          cp "$EXE" out/digital_clock.exe
          cp "$DLL" out/plugins/countdown_timer.dll

      - uses: actions/upload-artifact@v4
        with:
          name: digital_clock-flip-build
          path: out
