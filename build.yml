name: Build Digital Clock (flip animation)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this repo (for the patch)
        uses: actions/checkout@v4

      - name: Install Qt 5.12.9 (MinGW 7.3 32-bit, same as the official 4.7.8 build)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.12.9'
          host: 'windows'
          target: 'desktop'
          arch: 'win32_mingw73'
          tools: 'tools_mingw,7.3.0-1-1,qt.tools.win32_mingw730'
          cache: true

      - name: Put MinGW on PATH
        run: echo "$IQTA_TOOLS/mingw730_32/bin" >> "$GITHUB_PATH"

      - name: Get source (tag stable_4.7.8) and dependencies
        run: |
          git config --global core.autocrlf false
          mkdir work && cd work
          git clone --depth 1 --branch stable_4.7.8 https://github.com/Kolcha/DigitalClock4.git DigitalClock4
          mkdir 3rdparty
          git clone --depth 1 https://github.com/Skycoder42/QHotkey.git 3rdparty/QHotkey
          git clone --depth 1 https://github.com/itay-grudev/SingleApplication.git 3rdparty/SingleApplication

      - name: Apply flip animation patch
        run: |
          cd work/DigitalClock4
          git apply --ignore-whitespace "$GITHUB_WORKSPACE/flip-animation.patch"
          git status --short

      - name: Skip plugins (only the exe is needed)
        run: |
          cd work/DigitalClock4
          sed -i '/^    plugins$/d; /^plugins.depends/d' DigitalClock.pro

      - name: Build
        run: |
          cd work/DigitalClock4
          lupdate -no-obsolete DigitalClock.pro
          qmake -config release -r
          mingw32-make -j4

      - name: Collect result
        run: |
          mkdir out
          EXE=$(find work/DigitalClock4 -name digital_clock.exe | head -n1)
          echo "Built: $EXE"
          cp "$EXE" out/digital_clock.exe

      - uses: actions/upload-artifact@v4
        with:
          name: digital_clock-flip-exe
          path: out/digital_clock.exe
